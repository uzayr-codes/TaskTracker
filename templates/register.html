<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="tailwind.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800">
    <div class="container mx-auto p-6">
        <h2 class="text-2xl mb-4">Register</h2>
        <form method="POST" class="space-y-4">
            <div>
                <label for="username" class="block mb-1">Username</label>
                <input type="text" id="username" name="username" class="border p-2 w-full" placeholder="Enter your username">
            </div>
            <div>
                <label for="email" class="block mb-1">Email</label>
                <input type="email" id="email" name="email" class="border p-2 w-full" placeholder="Enter your email">
            </div>
            <div>
                <label for="password" class="block mb-1">Password</label>
                <input type="password" id="password" name="password" class="border p-2 w-full" placeholder="Enter your password">
            </div>
            <div>
                <label for="confirm_password" class="block mb-1">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" class="border p-2 w-full" placeholder="Confirm your password">
            </div>
            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded">Register</button>
        </form>
    </div>
</body>
</html>
