<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskTracker</title>
    <link href="tailwind.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800">
    <div class="container mx-auto p-6">
        <h1 class="text-3xl font-medium mb-6">Welcome, John Doe 👋</h1>

        <!-- Task Form -->
        <form method="POST" class="bg-white p-6 rounded-lg shadow mb-8">
            <div class="grid md:grid-cols-2 gap-4">
                <div>
                    <label class="block mb-1 font-medium">Title</label>
                    <input type="text" name="title" class="w-full p-2 border rounded">
                </div>
                <div>
                    <label class="block mb-1 font-medium">Description</label>
                    <input type="text" name="description" class="w-full p-2 border rounded">
                </div>
                <div>
                    <label class="block mb-1 font-medium">Deadline</label>
                    <input type="date" name="deadline" class="w-full p-2 border rounded">
                </div>
                <div>
                    <label class="block mb-1 font-medium">Priority</label>
                    <select name="priority" class="w-full p-2 border rounded">

                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="mt-4 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">
                ➕ Add Task
            </button>
        </form>

        <!-- Filter -->
        <div class="mb-4">
            <label for="filter" class="mr-2 font-medium">Filter:</label>
            <select id="filter" onchange="window.location.href='dashboard.html?status=' + this.value" class="p-2 border rounded">
                <option value="all" selected>All</option>
                <option value="completed">Completed</option>
                <option value="pending">Pending</option>
            </select>
        </div>

        <!-- Task List -->
        <div class="bg-white p-4 rounded shadow mb-4 flex justify-between items-center">
            <div>
                <h2 class="text-lg font-semibold">Task Title</h2>
                <p class="text-sm text-gray-600">Task description goes here.</p>
                <p class="text-sm">📅 Deadline: 2025-05-01</p>
                <p class="text-sm">⚡ Priority: Medium</p>
                <p class="text-sm">✅ Status: Pending</p>
            </div>
            <div class="flex gap-2">
                <!-- Toggle -->
                <form method="POST" action="/task/update">
                    <button type="submit" class="bg-yellow-500 hover:bg-yellow-600 text-white px-3 py-1 rounded">
                        Done
                    </button>
                </form>
                <!-- Edit -->
                <button onclick="openEditModal(1, 'Task Title', 'Task description', '2025-05-01', 'Medium')" class="bg-green-500 hover:bg-green-600 text-white px-3 py-1 rounded">Edit</button>
                <!-- Delete -->
                <form method="POST" action="/task/delete">
                    <button type="submit" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded">Delete</button>
                </form>
            </div>
        </div>

        <!-- Edit Modal -->
        <div id="editModal" class="fixed inset-0 bg-black bg-opacity-40 hidden justify-center items-center">
            <div class="bg-white p-6 rounded-lg shadow-lg w-full max-w-md">
                <h2 class="text-xl font-bold mb-4">Edit Task</h2>
                <form id="editForm" method="POST">
                    <input type="hidden" name="task_id" id="edit_task_id">
                    <div class="mb-3">
                        <label for="edit_title" class="block mb-1">Title</label>
                        <input type="text" id="edit_title" name="title" class="w-full p-2 border rounded">
                    </div>
                    <div class="mb-3">
                        <label for="edit_description" class="block mb-1">Description</label>
                        <input type="text" id="edit_description" name="description" class="w-full p-2 border rounded">
                    </div>
                    <div class="mb-3">
                        <label for="edit_deadline" class="block mb-1">Deadline</label>
                        <input type="date" id="edit_deadline" name="deadline" class="w-full p-2 border rounded">
                    </div>
                    <div class="mb-4">
                        <label for="edit_priority" class="block mb-1">Priority</label>
                        <select id="edit_priority" name="priority" class="w-full p-2 border rounded">
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>
                    <div class="flex justify-end gap-2">
                        <button type="button" onclick="closeEditModal()" class="bg-gray-400 hover:bg-gray-500 text-white px-4 py-2 rounded">Cancel</button>
                        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        function openEditModal(id, title, description, deadline, priority) {
            document.getElementById('edit_task_id').value = id;
            document.getElementById('edit_title').value = title;
            document.getElementById('edit_description').value = description;
            document.getElementById('edit_deadline').value = deadline;
            document.getElementById('edit_priority').value = priority;
            document.getElementById('editModal').classList.remove('hidden');
            document.getElementById('editModal').classList.add('flex');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('flex');
            document.getElementById('editModal').classList.add('hidden');
        }
    </script>
</body>
</html>
