<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="tailwind.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800">
    <div class="container mx-auto p-6">
        <h2 class="text-2xl mb-4">Login</h2>
        <form method="POST" class="space-y-4">
            <div>
                <label for="email" class="block mb-1">Email</label>
                <input type="email" id="email" name="email" class="border p-2 w-full" placeholder="Enter your email">
            </div>
            <div>
                <label for="password" class="block mb-1">Password</label>
                <input type="password" id="password" name="password" class="border p-2 w-full" placeholder="Enter your password">
            </div>
            <div>
                <label for="remember" class="inline-flex items-center">
                    <input type="checkbox" id="remember" name="remember" class="mr-2"> Remember me
                </label>
            </div>
            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded">Login</button>
        </form>
    </div>
</body>
</html>
